name: Deploy WASKITA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude '_site' --exclude '.git' --exclude '.github' --exclude 'node_modules' ./ _site/
          sed -i 's#href="/styles.css"#href="./styles.css"#g; s#src="/app.js"#src="./app.js"#g; s#src="/admin.js"#src="./admin.js"#g; s#href="/admin.html"#href="./admin.html"#g; s#href="/"#href="./index.html"#g' _site/index.html _site/admin.html
          touch _site/.nojekyll
          find _site -type f -name 'server.py' -delete
          test -f _site/index.html
          test -f _site/admin.html
          test -f _site/styles.css
          test -f _site/app.js
          test -f _site/admin.js
          ! grep -q 'href="/styles.css"' _site/index.html
          ! grep -q 'src="/app.js"' _site/index.html
          ! grep -q 'href="/styles.css"' _site/admin.html
          echo 'Static Pages smoke test: PASS'
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
