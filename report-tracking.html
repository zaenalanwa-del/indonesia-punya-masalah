<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lacak Laporan — Indonesia Punya Masalah</title><style>body{margin:0;font-family:Inter,system-ui,Arial;background:#eef4f8;color:#123b60}.wrap{max-width:900px;margin:auto;padding:30px 18px}.card{background:#fff;border:1px solid #d8e5ed;border-radius:16px;padding:22px;margin:14px 0}input,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #c8d9e4}input{width:100%;box-sizing:border-box}button{background:#0875d8;color:#fff;border-color:#0875d8;font-weight:800;cursor:pointer}.event{border-left:3px solid #0875d8;padding:9px 13px;margin:8px 0;background:#f7fbfe}.muted{color:#6d8293;font-size:13px}.danger{background:#fff5f5;border-left:3px solid #d71920;padding:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="wrap"><div class="card"><h1>🔎 Lacak Laporan</h1><p class="muted">Masukkan kode laporan. Detail pribadi hanya dapat ditampilkan setelah login dan hanya kepada pemilik laporan atau petugas berwenang.</p><div class="grid"><input id="email" type="email" placeholder="Email akun"><input id="password" type="password" placeholder="Kata sandi"></div><br><input id="code" placeholder="Contoh: IPM-20260924-ABC123"><br><br><button id="go">Masuk & Lacak</button><div id="msg" class="muted" style="margin-top:10px"></div></div><div id="result"></div><p><a href="/">← Beranda</a> · <a href="/platform-independen.html">Tentang Platform</a></p></main><script>(async()=>{const U='https://gfggmkeucgqkkyvummpu.supabase.co',K='sb_publishable_ptCVbq9h15prKhT0OO5Zmg_LkE3cbw0',sb=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true}});const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('go').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value,code=$('code').value.trim();$('msg').textContent='Memproses…';let s=(await sb.auth.getSession()).data.session;if(!s){const r=await sb.auth.signInWithPassword({email,password});if(r.error){$('msg').textContent=r.error.message;return}s=r.data.session}const {data,error}=await sb.rpc('portal_report_tracking_by_code',{p_tracking_code:code});if(error){$('msg').textContent='Laporan tidak dapat dilacak. Pastikan kode benar dan Anda adalah pemilik laporan.';return}if(!data?.report){$('msg').textContent='Laporan tidak ditemukan atau akses dibatasi.';return}const r=data.report;const events=data.events||[],assign=data.assignments||[];$('msg').textContent='';$('result').innerHTML='<div class="card"><h2>'+esc(r.title)+'</h2><p><b>'+esc(r.tracking_code)+'</b> · '+esc(r.current_status)+' · Prioritas '+esc(r.priority_level)+'</p><div class="grid"><div><b>Verifikasi</b><br>'+esc(r.verification_status)+'</div><div><b>Instansi rekomendasi</b><br>'+esc(r.recommended_agency||'Belum ditentukan')+'</div><div><b>Tenggat internal</b><br>'+esc(r.sla_due_at||'—')+'</div><div><b>Routing confidence</b><br>'+esc(r.routing_confidence??'—')+'</div></div><h3>Riwayat</h3>'+events.map(e=>'<div class="event"><b>'+esc(e.title||e.event_type)+'</b><br><small>'+esc(e.created_at)+'</small><p>'+esc(e.note||'')+'</p></div>').join('')+'<h3>Penugasan</h3>'+assign.map(a=>'<div class="event"><b>'+esc(a.agency_name)+'</b> · '+esc(a.status)+'<br>'+esc(a.note||'')+(a.external_reference?'<br>Ref: '+esc(a.external_reference):'')+'</div>').join('')+'<div class="danger"><b>Catatan independensi:</b> rekomendasi/penyaluran dari platform bukan jaminan instansi telah menerima atau menyetujui laporan.</div></div>'};})();</script></body></html>
