<style>

</style><style id="nk-four-monitor-v1">.monitorTabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}.monitorTabs button{border:1px solid var(--line);background:#f7fafc;color:var(--ink);border-radius:8px;padding:8px 6px;font-size:10px;font-weight:900;cursor:pointer}.monitorTabs button.active{background:var(--blue);border-color:var(--blue);color:#fff}.monitorTabs small{display:block;font-size:8px;font-weight:600;opacity:.8;margin-top:2px}.previewhead{display:block!important;padding:0!important}.monitorTabs button:hover{background:#eaf4fc;color:var(--blue)}.monitorTabs button.active:hover{background:var(--blue);color:#fff}@media(max-width:760px){.monitorTabs{grid-template-columns:repeat(2,1fr)}} </style><style id="nk-monitor-only-final">.previewhead{display:none!important}.framewrap{padding:0!important;align-items:stretch!important;justify-content:stretch!important}.frameshell{width:100%!important;max-width:none!important;height:100vh!important;min-height:0!important;border:0!important;border-radius:0!important;box-shadow:none!important}.frameshell iframe{height:100%!important}</style></head><body><div class="admin">
