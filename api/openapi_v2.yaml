openapi: 3.1.0
info:
  title: Indonesia Punya Masalah API
  version: 2.0.0
  description: Vertical-slice API for question-to-intelligence workflows.
servers:
  - url: http://127.0.0.1:8787
paths:
  /api/health:
    get:
      responses:
        '200': {description: Healthy}
  /api/ask:
    get:
      parameters:
        - in: query
          name: q
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Structured intelligence answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerRun'
components:
  schemas:
    AnswerRun:
      type: object
      required: [status, question, summary, confidence, sources]
      properties:
        status: {type: string}
        question: {type: string}
        summary: {type: string}
        confidence: {type: number}
        evidence_strength: {type: string}
        intent: {type: object}
        sources:
          type: array
          items:
            type: object
            properties:
              source: {type: string}
              type: {type: string}
              reliability: {type: number}
              metric: {type: string}
              value: {}
              unit: {type: string}
              observed_at: {type: string}
        uncertainty:
          type: array
          items: {type: string}
        next_actions:
          type: array
          items: {type: string}
